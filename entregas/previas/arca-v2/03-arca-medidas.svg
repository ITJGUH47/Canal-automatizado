o são especificados integralmente no texto.</text><text x="1925" y="1112" font-family="DejaVu Sans" font-size="17" fill="#3e382c" text-anchor="end">MEDIDAS EM CÔVADOS · SEM CONVERSÃO FIXA EM METROS</text><text x="1925" y="1151" font-family="DejaVu Sans" font-size="16" fill="#3e382c" text-anchor="end">Ilustração original em SVG, criada por código. Sem geração de voz ou vídeo.</text></svg>